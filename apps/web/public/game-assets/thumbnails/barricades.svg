<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1c140a"/>
      <stop offset="60%" stop-color="#0b0e11"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pawnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- Isometric Board Grid -->
  <g transform="translate(400, 240) scale(1, 0.58) rotate(45)" opacity="0.65">
    <!-- Grid squares -->
    <rect x="-180" y="-180" width="360" height="360" rx="16" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    
    <!-- Grid lines -->
    <path d="
      M -140,-180 L -140,180 M -100,-180 L -100,180 M -60,-180 L -60,180 M -20,-180 L -20,180
      M 20,-180 L 20,180 M 60,-180 L 60,180 M 100,-180 L 100,180 M 140,-180 L 140,180
      M -180,-140 L 180,-140 M -180,-100 L 180,-100 M -180,-60 L 180,-60 M -180,-20 L 180,-20
      M -180,20 L 180,20 M -180,60 L 180,60 M -180,100 L 180,100 M -180,140 L 180,140
    " stroke="#1e293b" stroke-width="2"/>

    <!-- Pathway trace -->
    <path d="M 0,160 L 0,80 L -80,80 L -80, -40 L 40,-40 L 40,-140 L 0,-160" 
          stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Vertical Wooden Barricades (Projected) -->
  <g filter="url(#glow)">
    <!-- Wall 1 -->
    <path d="M 330,190 L 370,170 L 370,140 L 330,160 Z" fill="#d97706" opacity="0.9"/>
    <path d="M 370,170 L 420,195 L 420,165 L 370,140 Z" fill="#b45309" opacity="0.95"/>
    <path d="M 330,160 L 370,140 L 420,165 L 380,185 Z" fill="#fbbf24"/>

    <!-- Wall 2 -->
    <path d="M 450,230 L 490,210 L 490,180 L 450,200 Z" fill="#d97706" opacity="0.9"/>
    <path d="M 490,210 L 530,230 L 530,200 L 490,180 Z" fill="#b45309" opacity="0.95"/>
    <path d="M 450,200 L 490,180 L 530,200 L 490,220 Z" fill="#f59e0b"/>

    <!-- Wall 3 (Back) -->
    <path d="M 380,130 L 420,110 L 420,85 L 380,105 Z" fill="#92400e" opacity="0.8"/>
    <path d="M 420,110 L 460,130 L 460,105 L 420,85 Z" fill="#78350f" opacity="0.85"/>
    <path d="M 380,105 L 420,85 L 460,105 L 420,125 Z" fill="#d97706"/>
  </g>

  <!-- The Golden Pawn -->
  <g transform="translate(400, 260)" filter="url(#pawnGlow)">
    <!-- Pawn Shadow -->
    <ellipse cx="0" cy="15" rx="35" ry="12" fill="#000000" opacity="0.7"/>
    <!-- Pawn Base -->
    <ellipse cx="0" cy="8" rx="28" ry="10" fill="#f59e0b"/>
    <path d="M -22,6 C -18,-15 -8,-35 -8,-45 L 8,-45 C 8,-35 18,-15 22,6 Z" fill="url(#wallGrad)"/>
    <!-- Collar -->
    <ellipse cx="0" cy="-45" rx="16" ry="6" fill="#fbbf24"/>
    <!-- Pawn Head -->
    <circle cx="0" cy="-65" r="18" fill="#fef3c7"/>
    <circle cx="-5" cy="-70" r="5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Atmospheric Vignette / Edge Shadow -->
  <rect width="800" height="450" fill="none" stroke="#000" stroke-width="2" opacity="0.4"/>
</svg>

