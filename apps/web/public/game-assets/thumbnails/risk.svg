<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="riskGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="60%" stop-color="#0e0708"/>
      <stop offset="100%" stop-color="#050304"/>
    </radialGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#riskGlow)"/>

  <!-- Radar / Lat-Long Grid -->
  <g opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3">
    <circle cx="400" cy="225" r="120" fill="none"/>
    <circle cx="400" cy="225" r="220" fill="none"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
  </g>

  <!-- World Vector Silhouette Polygons (North America, Europe, Asia, S.America, Africa, Australia) -->
  <g stroke="#f87171" stroke-width="2" fill="#ef4444" fill-opacity="0.12" filter="url(#crimsonGlow)">
    <!-- North America -->
    <polygon points="120,90 260,80 300,120 280,180 200,210 170,180 110,130"/>
    <!-- South America -->
    <polygon points="210,230 260,240 280,310 230,380 200,310 190,250"/>
    <!-- Europe -->
    <polygon points="360,90 440,80 460,130 410,160 350,140 340,110"/>
    <!-- Africa -->
    <polygon points="360,180 450,190 470,260 420,350 370,300 340,220"/>
    <!-- Asia -->
    <polygon points="480,70 680,60 720,150 660,200 550,220 480,150"/>
    <!-- Australia -->
    <polygon points="630,270 720,260 740,330 650,350 610,310"/>
  </g>

  <!-- Connection Links (Battle Routes) -->
  <g stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
    <line x1="280" y1="180" x2="230" y2="240"/>
    <line x1="260" y1="80" x2="360" y2="90"/>
    <line x1="410" y1="160" x2="400" y2="190"/>
    <line x1="440" y1="110" x2="520" y2="110"/>
    <line x1="450" y1="210" x2="550" y2="220"/>
    <line x1="660" y1="200" x2="670" y2="270"/>
  </g>

  <!-- Tactical Territory Nodes & Troop Counts -->
  <g filter="url(#crimsonGlow)">
    <!-- North America Pin -->
    <circle cx="210" cy="140" r="16" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="145" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">5</text>

    <!-- Europe Pin -->
    <circle cx="400" cy="120" r="16" fill="#1f2937" stroke="#fbbf24" stroke-width="2"/>
    <text x="400" y="125" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Asia Pin -->
    <circle cx="600" cy="140" r="18" fill="#1f2937" stroke="#ef4444" stroke-width="2.5"/>
    <text x="600" y="146" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">12</text>

    <!-- Africa Pin -->
    <circle cx="410" cy="270" r="15" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
    <text x="410" y="275" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">4</text>

    <!-- South America Pin -->
    <circle cx="240" cy="290" r="15" fill="#1f2937" stroke="#fbbf24" stroke-width="2"/>
    <text x="240" y="295" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">6</text>

    <!-- Australia Pin -->
    <circle cx="670" cy="310" r="14" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
    <text x="670" y="315" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- Glowing Combat Crosshair / Target -->
  <g transform="translate(600, 140)" stroke="#ef4444" stroke-width="2" opacity="0.8">
    <circle cx="0" cy="0" r="28" fill="none" stroke-dasharray="6,4"/>
  </g>
</svg>

