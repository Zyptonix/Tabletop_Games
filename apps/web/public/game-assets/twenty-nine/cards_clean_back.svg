<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 336" width="240" height="336">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#142c4c"/>
      <stop offset="70%" stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#050d18"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Diamond Pattern -->
    <pattern id="diamondGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 20 10 L 10 20 L 0 10 Z" fill="none" stroke="#254670" stroke-width="1"/>
      <path d="M 10 3 L 17 10 L 10 17 L 3 10 Z" fill="none" stroke="#1d385a" stroke-width="0.5"/>
      <circle cx="10" cy="10" r="1.2" fill="#ca8a04" opacity="0.8"/>
      <circle cx="0" cy="0" r="1" fill="#eab308" opacity="0.6"/>
      <circle cx="20" cy="0" r="1" fill="#eab308" opacity="0.6"/>
      <circle cx="0" cy="20" r="1" fill="#eab308" opacity="0.6"/>
      <circle cx="20" cy="20" r="1" fill="#eab308" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Crisp Solid White Card Body & Outer Border -->
  <rect x="2" y="2" width="236" height="332" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Inner Margin Line -->
  <rect x="8" y="8" width="224" height="320" rx="10" fill="none" stroke="#94a3b8" stroke-width="0.75"/>

  <!-- Main Card Field -->
  <rect x="12" y="12" width="216" height="312" rx="8" fill="url(#bgGrad)"/>

  <!-- Gold Pinstripe Frame -->
  <rect x="16" y="16" width="208" height="304" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <rect x="19" y="19" width="202" height="298" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Diamond Lattice Texture Field -->
  <rect x="20" y="20" width="200" height="296" rx="4" fill="url(#diamondGrid)"/>

  <!-- Corner Flourish Accents -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none">
    <!-- Top-Left -->
    <path d="M 23 35 L 35 23 M 23 29 L 29 23"/>
    <!-- Top-Right -->
    <path d="M 217 35 L 205 23 M 217 29 L 211 23"/>
    <!-- Bottom-Left -->
    <path d="M 23 301 L 35 313 M 23 307 L 29 313"/>
    <!-- Bottom-Right -->
    <path d="M 217 301 L 205 313 M 217 307 L 211 313"/>
  </g>

  <!-- Central Medallion Aura -->
  <circle cx="120" cy="168" r="42" fill="#091422" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="120" cy="168" r="37" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,2"/>
  <circle cx="120" cy="168" r="33" fill="#0f233d" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- 8-Point Geometric Star -->
  <g fill="url(#goldGrad)">
    <!-- Vertical / Horizontal Points -->
    <polygon points="120,138 123,165 150,168 123,171 120,198 117,171 90,168 117,165"/>
    <!-- Diagonal Points -->
    <polygon points="120,146 123,165 142,146 123,171 120,190 117,171 98,190 117,165" opacity="0.7"/>
  </g>

  <!-- Center Number 29 / Core Seal -->
  <circle cx="120" cy="168" r="14" fill="#050d18" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <text x="120" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">29</text>
</svg>
