services:
  - type: web
    name: tabletop-arena-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false --prod=false && pnpm run build:server
    startCommand: pnpm --filter @tabletop/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYED_GAMES
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: SOCKET_PATH
        value: /socket.io
