services:
  - type: web
    name: tabletop-arena-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @tabletop/db prisma:generate && pnpm --filter @tabletop/server build
    startCommand: pnpm --filter @tabletop/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYED_GAMES
        value: classic-uno,uno-no-mercy
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: SOCKET_PATH
        value: /socket.io
